<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hand Controlled Rubik's Cube</title>

    <!-- The page design is kept in its own CSS file. -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="info">
    <h2>3D Rubik's Cube</h2>

</div>
<div id="cube-buttons">
    <button id="shuffle-button">🔀 Shuffle</button>
    <button id="reset-button">↻ Reset</button>
</div>
<div id="camera-container">

    <video
        id="webcam"
        autoplay
        playsinline>
    </video>

    <canvas id="hand-canvas"></canvas>

    <div id="hand-status">
        Starting camera...
    </div>

</div>
<!-- These links let JavaScript load the 3D library. -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<!-- JavaScript runs the cube and tracks your hand movements. -->
<script type="module" src="script.js"></script>

</body>
</html>
